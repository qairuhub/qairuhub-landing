# qairuhub-edge: internal Worker that holds the OpenAI key (DECISIONS §5). Owned by WP4.
# Reachable only through the Pages project's service binding `EDGE`: no workers.dev URL, no preview
# URLs, no routes. Deploy from this directory: `npx wrangler deploy` (Release agent).
name = "qairuhub-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# The key lives in Cloudflare Secrets Store; the value is read at runtime with `await env.OPENAI_KEY.get()`.
[[secrets_store_secrets]]
binding = "OPENAI_KEY"
store_id = "c2d5d6fdb950415887cdad3cc7cefd62"
secret_name = "chatgpt-api"

[observability]
enabled = true
head_sampling_rate = 1
